const MAXN=100000, COLS=7, MINROWS=5;
const weights=data.map(x=>Math.round(x[1]*10000));
const sum=weights.reduce((a,b)=>a+b,0);
if(sum!==1000000)throw new Error('확률 합계가 100%가 아닙니다.');
const cumulative=[];weights.reduce((a,b,i)=>(cumulative[i]=a+b),0);
const counts=Array(data.length).fill(0);let total=0;
const $=id=>document.getElementById(id), fmt=n=>n.toLocaleString('ko-KR');
const isRare=i=>data[i][1]<=.1;

const randomBuffer=new Uint32Array(4096);let randomCursor=randomBuffer.length;
function ticket(){let n;const limit=Math.floor(4294967296/sum)*sum;
  do{if(randomCursor===randomBuffer.length){crypto.getRandomValues(randomBuffer);randomCursor=0;}
  n=randomBuffer[randomCursor++];}while(n>=limit);return n%sum;}
function pick(n){let lo=0,hi=cumulative.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;if(n<cumulative[mid])hi=mid;else lo=mid+1;}return lo;}

function digits(n){return String(n).split('').map(d=>'<i class="d" style="background-position:'+(-d*9)+'px 0"></i>').join('');}

let timer=null, revealing=false;
let draws=null, fin=null, pos=0, plan=0, stepIdx=0, stepIv=60, target=0;
const slotEl=[]; let nextCell=0;
const wrap=()=>$('grid').parentElement;

function resetGrid(){
  $('grid').innerHTML=Array(COLS*MINROWS).fill('<div class="slot"></div>').join('');
  slotEl.length=0;nextCell=0;wrap().scrollTop=0;
}
function clearGrid(msg){
  stop();counts.fill(0);total=0;draws=null;fin=null;
  resetGrid();
  $('sectInfo').textContent='';
  $('status').innerHTML=msg||'상자를 열어 보세요.';
}
function stop(){if(timer){clearTimeout(timer);timer=null;}revealing=false;$('useBtn').disabled=false;}

function placeSlot(i){
  const grid=$('grid');
  if(nextCell>=grid.children.length)
    for(let k=0;k<COLS;k++)grid.insertAdjacentHTML('beforeend','<div class="slot"></div>');
  const el=grid.children[nextCell++];
  el.dataset.i=i;
  el.className='slot'+(isRare(i)?' rare':'')+' on';
  el.innerHTML='<img class="ic" src="'+itemIcons[i]+'" alt=""><span class="qty"><span class="dn"></span></span>';
  slotEl[i]=el;
  const w=wrap(),off=el.offsetTop+el.offsetHeight-w.clientHeight;
  if(off>w.scrollTop)w.scrollTop=off;
  return el;
}
function paintQty(i,bump){
  const el=slotEl[i];if(!el)return;
  const q=el.querySelector('.qty'),dn=q.firstChild,t=String(counts[i]).length;
  q.style.transform=t>3?'scale('+(t===4?.8:t===5?.68:.58)+')':'';
  dn.innerHTML=digits(counts[i]);
  if(bump){dn.classList.remove('bump');void dn.offsetWidth;dn.classList.add('bump');}
}
function apply(upto){
  let newRare=false;
  for(;pos<upto;pos++){
    const i=draws[pos];counts[i]++;total++;
    if(counts[i]===1){placeSlot(i);if(isRare(i))newRare=true;}
  }
  return newRare;
}

function openBoxes(n){
  if(!Number.isInteger(n)||n<1||n>MAXN)throw new Error('1부터 '+fmt(MAXN)+'까지 입력해 주세요.');
  stop();
  counts.fill(0);total=0;pos=0;
  draws=new Int32Array(n);
  fin=new Array(data.length).fill(0);
  for(let j=0;j<n;j++){const i=pick(ticket());draws[j]=i;fin[i]++;}
  resetGrid();
  target=n;
  plan=Math.min(n,150);stepIdx=0;
  stepIv=Math.max(16,Math.min(220,2400/plan));
  revealing=true;$('useBtn').disabled=true;
  $('sectInfo').textContent='0 / '+data.length+'종';
  tick();
  return {opened:n,items:fin.map((c,i)=>c?{name:data[i][0],count:c}:null).filter(Boolean)};
}

function tick(){
  const upto=Math.round((stepIdx+1)*target/plan);
  const before=[];
  for(let k=pos;k<upto;k++)before.push(draws[k]);
  const rare=apply(upto);
  const seen={};before.forEach(i=>seen[i]=1);
  Object.keys(seen).forEach(i=>paintQty(+i,true));
  stepIdx++;
  $('sectInfo').textContent=nextCell+' / '+data.length+'종';
  $('status').innerHTML='개봉 <span class="hi">'+fmt(total)+'</span> / '+fmt(target)+
    ' <span style="color:#6f695d">(클릭 시 건너뛰기)</span>';
  if(pos>=target){finish();return;}
  timer=setTimeout(tick,rare?stepIv+260:stepIv);
}

function finish(){
  stop();
  const kinds=fin?fin.filter(Boolean).length:0;
  const rare=fin?fin.reduce((a,c,i)=>a+(isRare(i)?c:0),0):0;
  $('status').innerHTML='<span class="hi">'+fmt(total)+'</span>개 개봉 · '+kinds+'종 획득 · 0.1% 이하 <span class="hi">'+fmt(rare)+'</span>개';
}

function skip(){
  if(!revealing)return;
  if(timer){clearTimeout(timer);timer=null;}
  apply(target);
  $('sectInfo').textContent=nextCell+' / '+data.length+'종';
  for(let i=0;i<counts.length;i++)if(counts[i])paintQty(i,false);
  finish();
}

function setAmount(v){
  v=Math.max(1,Math.min(MAXN,Math.floor(v)||1));
  $('amount').value=fmt(v);return v;
}
function getAmount(){return parseInt(String($('amount').value).replace(/[^0-9]/g,''),10)||0;}

$('useBtn').addEventListener('click',()=>{
  const n=setAmount(getAmount());
  try{openBoxes(n);}catch(e){$('status').textContent=e.message;}
});
document.querySelectorAll('.nb').forEach(b=>b.addEventListener('click',()=>{
  const a=b.dataset.act,v=getAmount()||1;
  setAmount(a==='min'?1:a==='max'?MAXN:a==='inc'?v+1:v-1);
}));
$('amount').addEventListener('change',()=>setAmount(getAmount()));
$('amount').addEventListener('focus',e=>e.target.select());
$('amount').addEventListener('keydown',e=>{if(e.key==='Enter')$('useBtn').click();});
$('resetBtn').addEventListener('click',()=>clearGrid('결과를 초기화했습니다.'));
$('win').addEventListener('click',e=>{if(revealing&&!e.target.closest('button'))skip();});

const tip=$('tip');
$('grid').addEventListener('mouseover',e=>{
  const s=e.target.closest('.slot');
  if(!s||!s.dataset.i){tip.style.display='none';return;}
  const i=+s.dataset.i,p=data[i][1],c=counts[i];
  tip.className='tip'+(isRare(i)?' rare':'');
  tip.innerHTML='<span class="n">'+data[i][0]+'</span>'+
    '<span class="r">설정 확률<span class="v">'+p.toFixed(4)+'%</span></span><br>'+
    '<span class="r">획득 수<span class="v">'+fmt(c)+'개</span></span><br>'+
    '<span class="r">실제 비율<span class="v">'+(total?(c/total*100).toFixed(4)+'%':'—')+'</span></span>';
  tip.style.display='block';
  const r=s.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let x=r.right+10,y=r.top;
  if(x+w>innerWidth-6)x=r.left-w-10;
  if(x<6)x=6;
  if(y+h>innerHeight-6)y=innerHeight-h-6;
  tip.style.left=x+'px';tip.style.top=Math.max(6,y)+'px';
});
$('grid').addEventListener('mouseleave',()=>tip.style.display='none');
window.addEventListener('scroll',()=>tip.style.display='none',{passive:true});

function fit(){
  const s=Math.min(1.75,Math.max(1,(Math.min(innerWidth,720)-20)/356));
  document.getElementById('stage').style.zoom=s;
}
addEventListener('resize',fit);fit();
clearGrid();
setAmount(1);

if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({
  name:'open_gift_boxes',
  description:'철희의 선물상자를 지정한 수량만큼 모의 추첨합니다. 호출할 때마다 이전 결과는 초기화되고 이번 결과만 표시됩니다.',
  inputSchema:{type:'object',properties:{count:{type:'integer',minimum:1,maximum:100000}},required:['count'],additionalProperties:false},
  annotations:{readOnlyHint:false},
  execute:input=>{setAmount(input.count);return openBoxes(input.count);}
})).catch(()=>{});}catch{}}
</script>
</body>
</html>
